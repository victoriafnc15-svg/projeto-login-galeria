<!DOCTYPE html>
<!-- Documento HTML5. -->

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Galeria de Fotos - Login</title>

    <!-- Bootstrap (permitido pelo enunciado) para a apresentação. -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Estilos próprios do projeto. -->
    <link href="css/style.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Barra superior. O botão Sair só aparece depois do login. -->
    <nav class="navbar bg-dark navbar-dark">
        <div class="container">
            <span class="navbar-brand">Galeria de Fotos</span>

            <div class="d-flex align-items-center gap-3">
                <!-- Nome do usuário logado (preenchido pelo JavaScript). -->
                <span id="usuarioLogado" class="text-light small d-none"></span>

                <!-- Opção para sair e voltar ao login. -->
                <button id="btnSair" class="btn btn-outline-light btn-sm d-none" type="button">
                    Sair
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <!-- O JavaScript desenha cada tela dentro desta div (SPA). -->
        <div id="app"></div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
